name: Build and release

# Manual: download the pinned corpora (16.8 GB + 2.2 GB), run the whole
# pipeline and publish both zips as the latest GitHub release so Yomitan's
# "Check for updates" picks them up. Needs ~27 GB of disk. The first three runs
# took 2 h 02 min to 3 h 32 min on a standard runner, most of it single-process
# schema validation; with validation on every core the fourth took 1 h 32 min.
# Validation now checks each distinct entry shape once, and `all` ends with a
# quality audit whose golden-word checks fail the build; the first run with
# both took 1 h 00 min (validation 3.5 min, smoke test and audit 7.5 min).

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub release (off: build only, zips kept as a workflow artifact)"
        type: boolean
        default: true
      skip_validation:
        description: "Skip the schema validation of both zips (the slowest step)"
        type: boolean
        default: false
      revision:
        description: "index.json revision, dot-separated integers (default: UTC date + run number, e.g. 2026.11.09.12)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      PYTHONUTF8: "1"
      HF_XET_HIGH_PERFORMANCE: "1"
    defaults:
      run:
        # Naming the shell makes Actions run it as `bash -eo pipefail`. With the
        # default (`bash -e`) a failing `python ... | tee log` still succeeds,
        # and a build whose validation failed would be published.
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        # GitHub documents ~14 GB free on standard runners; the pipeline needs
        # ~27 GB. Removing preinstalled toolchains frees 20+ GB. (The first run
        # actually saw 88 GB free before this step, so it is a safety margin.)
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
                      /usr/local/.ghcup /usr/share/swift /usr/local/share/boost /usr/lib/jvm \
                      /usr/local/share/chromium /usr/local/lib/node_modules "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          sudo apt-get clean > /dev/null 2>&1 || true
          df -h / | tail -1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -r requirements.txt

      - name: Choose the revision
        env:
          # Passed through the environment, never pasted into the script text.
          INPUT_REVISION: ${{ inputs.revision }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          rev="$INPUT_REVISION"
          [ -n "$rev" ] || rev="$(date -u +%Y.%m.%d).$RUN_NUMBER"
          if ! [[ "$rev" =~ ^[0-9]+(\.[0-9]+){3}$ ]]; then
            echo "::error::revision '$rev' must be four dot-separated integers, e.g. 2026.11.09.12"
            exit 1
          fi
          echo "REVISION=$rev" >> "$GITHUB_ENV"
          echo "revision $rev"

      - name: Download the pinned inputs (verifies size and SHA-256)
        # Optional secret: authenticated requests get higher rate limits. The
        # datasets are public, so the step also works when the secret is not set.
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -m baike2yomitan inputs download
          df -h / | tail -1

      - name: Extract, merge, build, validate, smoke
        run: |
          python -m baike2yomitan all --overlay-hf --pinyin --traditional s2tw --infobox \
            --exclude-tags 人物,企业,学校 --update-url github --revision "$REVISION" --no-hash \
            ${{ inputs.skip_validation && '--no-validate' || '' }} | tee data/all.log
          df -h / | tail -1
          ls -l dist/

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ env.REVISION }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            data/extract_report.md
            data/all.log
            data/stats/*.json
            dist/*.index.json

      - name: Upload zips as an artifact (build-only run)
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@v7
        with:
          name: dictionaries-${{ env.REVISION }}
          retention-days: 7
          path: dist/*.zip

      - name: Publish the release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m baike2yomitan release --tag "v$REVISION"
